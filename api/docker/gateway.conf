server {
    listen 80;
    server_name _;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Host $host;
    }
    location = /planner { return 302 /planner/; }
    location /planner/ {
        proxy_pass http://planner:80;
        proxy_set_header Host $host;
    }
    location = /shiplog { return 302 /shiplog/; }
    location /shiplog/ {
        proxy_pass http://shiplog:80;
        proxy_set_header Host $host;
    }
    location = /ladders { return 302 /ladders/; }
    location /ladders/ {
        proxy_pass http://ladders:80;
        proxy_set_header Host $host;
    }
    location = /pulse { return 302 /pulse/; }
    location /pulse/ {
        proxy_pass http://pulse:80;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
